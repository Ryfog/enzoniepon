<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les réponses</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1524">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--nuit:#1a1524;--ink:#f3ecf7;--doux:#a396b5;--lilas:#b79aec;--rose:#f18fb0;--or:#f0c46a;--edge:rgba(243,236,247,.14)}
    body{
      margin:0;min-height:100vh;background:var(--nuit);color:var(--ink);
      font-family:'Karla',system-ui,sans-serif;line-height:1.65;padding:30px 18px;
    }
    body::before{
      content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(60% 50% at 20% 0%,rgba(107,75,176,.35),transparent 70%),
                 radial-gradient(50% 45% at 85% 100%,rgba(176,75,122,.28),transparent 70%);
    }
    .in{position:relative;z-index:1;width:min(760px,100%);margin:0 auto}
    .sur{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--doux);margin:0 0 12px;font-weight:600}
    h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.1;margin:0 0 24px}
    .boite{
      background:rgba(36,29,51,.72);border:1px solid var(--edge);border-radius:22px;
      padding:26px 22px;backdrop-filter:blur(14px);
    }
    label{display:block;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--doux);margin:0 0 8px}
    input{
      width:100%;padding:14px 16px;border-radius:14px;background:rgba(243,236,247,.07);
      border:1.5px solid var(--edge);color:var(--ink);font-family:'Karla',sans-serif;
      font-size:1.05rem;outline:none;transition:border-color .2s;
    }
    input:focus{border-color:var(--lilas)}
    button{
      font-family:'Karla',sans-serif;font-weight:700;font-size:1rem;border:none;
      border-radius:999px;padding:14px 30px;cursor:pointer;color:#1c1329;margin-top:14px;
      background:linear-gradient(120deg,var(--lilas),var(--rose));width:100%;
    }
    button:hover{filter:brightness(1.07)}
    .msg{min-height:1.4em;margin:14px 0 0;font-size:.92rem;color:var(--or);font-weight:600}
    .meta{
      display:flex;gap:12px;flex-wrap:wrap;margin:0 0 20px;
      font-size:.84rem;color:var(--doux);
    }
    .meta b{color:var(--ink)}
    pre{
      white-space:pre-wrap;word-break:break-word;margin:0;
      font-family:'Karla',sans-serif;font-size:.95rem;line-height:1.75;color:var(--ink);
    }
    .rep{margin-top:22px}
  </style>
</head>
<body>
  <div class="in">
    <p class="sur">Espace privé</p>
    <h1>Les réponses de Stacy</h1>

    <div class="boite" id="porte">
      <label for="mdp">Mot de passe</label>
      <input type="password" id="mdp" autocomplete="off" placeholder="…">
      <button id="ouvrir">Déchiffrer</button>
      <p class="msg" id="msg"></p>
    </div>

    <div class="boite rep" id="zone" hidden>
      <div class="meta" id="meta"></div>
      <pre id="texte"></pre>
    </div>
  </div>

<script>
const BOITE = 'https://jsonblob.com/api/jsonBlob/019fdbf1-2700-7db5-9051-0cbe36acf314';
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const deb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function cleDepuis(mdp, sel) {
  const base = await crypto.subtle.importKey('raw', enc.encode(mdp), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: sel, iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function ouvrir() {
  const mdp = $('#mdp').value.trim();
  if (!mdp) return;
  $('#msg').textContent = 'Lecture…';
  let paquet;
  try {
    const r = await fetch(BOITE + '?t=' + Date.now());
    paquet = await r.json();
  } catch (e) {
    $('#msg').textContent = 'Impossible de joindre la boîte. Réessaie dans un instant.';
    return;
  }
  if (!paquet || !paquet.data) {
    $('#msg').textContent = 'Rien pour le moment — elle n\'a pas encore terminé.';
    return;
  }
  try {
    const k = await cleDepuis(mdp, deb64(paquet.sel));
    const clair = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: deb64(paquet.iv) }, k, deb64(paquet.data));
    const o = JSON.parse(dec.decode(clair));
    const d = new Date(o.quand);
    $('#meta').innerHTML =
      `<span>Reçu le <b>${d.toLocaleDateString('fr-FR')}</b> à <b>${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</b></span>` +
      `<span><b>${o.nb}</b> réponses sur ${o.total}</span>`;
    $('#texte').textContent = o.texte;
    $('#porte').hidden = true;
    $('#zone').hidden = false;
  } catch (e) {
    $('#msg').textContent = 'Mot de passe incorrect.';
  }
}
$('#ouvrir').addEventListener('click', ouvrir);
$('#mdp').addEventListener('keydown', e => { if (e.key === 'Enter') ouvrir(); });
</script>
</body>
</html>
