<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>&nbsp;</title>
<link rel="icon" href="data:,">
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  /* Le texte est visible par defaut. L'animation ne fait que l'amener :
     si elle ne part pas, la page reste lisible au lieu de rester noire. */
  p {
    margin: 0; padding: 0 24px; color: #6a6a6a;
    font-size: clamp(1.5rem, 6vw, 2.6rem);
    letter-spacing: .04em; text-align: center;
    animation: venir 2.6s ease;
  }
  @keyframes venir { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { p { animation: none; } }
</style>
</head>
<body>
  <p>c'est fini</p>
</body>
</html>
