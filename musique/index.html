<body>

<canvas id="scene"></canvas>

<p class="consigne" id="consigne">Tourne la manivelle</p>

<div class="phrase" id="phrase" hidden>

  <p class="phrase-txt" id="phrase-txt"></p>
</div>

<div class="final" id="final" hidden>
  <div class="final-in">
    <p class="final-sur">Elle ne s'arrêtera que si tu la laisses</p>
    <h1 class="final-titre">Alors je la<br><em>remonterai</em></h1>
    <p class="final-txt">
      Tous les jours s'il le faut.<br>
      Reviens l'écouter quand tu veux.
    </p>
    <button class="final-btn" id="rejouer">Tout recommencer</button>
  </div>
</div>
